<body class="bg-gray-950">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, createContext, useContext } = React

// ── Helpers ──────────────────────────────────────────────────────────────────
const uid = () => Math.random().toString(36).slice(2)+Date.now().toString(36)
const todayStr = () => new Date().toISOString().split('T')[0]
const daysAgo = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0] }
const fmtShort = s => { if(!s) return ''; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('nl-NL',{month:'short',day:'numeric'}) }
const fmtLong  = s => { if(!s) return ''; const d=new Date(s+'T12:00:00'); return d.toLocaleDateString('nl-NL',{weekday:'long',year:'numeric',month:'long',day:'numeric'}) }
const fmtTime  = s => { if(!s) return ''; return new Date(s).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}) }
const getLast30 = () => Array.from({length:30},(_,i)=>daysAgo(29-i))
const initials = n => n ? n.split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2) : '?'
const phaseColor = p => ({1:'#ef4444',2:'#60a5fa',3:'#1d4ed8'}[p]||'#6b7280')
const phaseName  = p => ({1:'Reset',2:'Build',3:'Dominate'}[p]||'–')
const phaseDesc  = p => ({1:'Slechte gewoontes elimineren',2:'Goede gewoontes opbouwen',3:'Gewoontes duurzaam maken'}[p]||'')
const moodColor  = m => ({1:'#ef4444',2:'f97316',3:'#eab308',4:'#22c55e',5:'#10b981'}[m]||'#6b7280')
const moodLabel  = m => ({1:'Slecht',2:'Matig',3:'Oké',4:'Goed',5:'Top'}[m]||'Oké')
const calcStreak = (comps, habitId) => { let s=0; for(let i=0;i<365;i++){const d=daysAgo(i); if(comps.some(c=>c.habitId===habitId&&c.date===d))s++; else break;} return s; }

// ── Seed Data ────────────────────────────────────────────────────────────────
function buildSeed() {
  const comps = []
  ;['h1','h2','h3','h4'].forEach((id,idx) => {
    for(let i=0;i<30;i++) {
      if(Math.random()>(idx<2?0.15:0.3)) comps.push({id:`c-${id}-${i}`,habitId:id,userId:'client-1',date:daysAgo(i)})
    }
  })
  return {
    users:[
      {id:'coach-1',name:'Yasha Kul',email:'coach@shift.com',password:'coach123',role:'coach',avatarColor:'#1d4ed8'},
      {id:'client-1',name:'Milan de Vries',email:'milan@demo.com',password:'client123',role:'client',coachId:'coach-1',phase:2,avatarColor:'#3b82f6',weight:82,startWeight:85,height:180,age:24,city:'Amsterdam',phone:'0612345678',experience:'intermediate',goal:'Betere leefgewoontes, afvallen en meer energie.',startDate:daysAgo(45)},
      {id:'client-2',name:'Sara Bakker',email:'sara@demo.com',password:'client123',role:'client',coachId:'coach-1',phase:1,avatarColor:'#8b5cf6',weight:65,startWeight:68,height:168,age:28,city:'Rotterdam',phone:'0687654321',experience:'beginner',goal:'Slechte gewoontes doorbreken, gezonder eten.',startDate:daysAgo(12)},
    ],
    journals:[
      {id:'j1',userId:'client-1',date:daysAgo(0),title:'Sterke dag',content:'Vandaag was een productieve dag. Ik heb mijn ochtendroutine volledig gevolgd en me goed gevoeld.',learnings:'Ik merk dat vroeg opstaan mijn hele dag beter maakt.',mood:4,createdAt:new Date().toISOString()},
      {id:'j2',userId:'client-1',date:daysAgo(1),title:'Uitdagende dag',content:'Gisteren was lastig. Ik had weinig energie maar heb toch doorgezet.',learnings:'Zelfs op slechte dagen: kleine stappen tellen.',mood:3,createdAt:new Date(Date.now()-86400000).toISOString()},
      {id:'j3',userId:'client-1',date:daysAgo(3),title:'PR op deadlift!',content:'Nieuw persoonlijk record: 130kg deadlift! Energie was door het dak.',learnings:'Goede slaap + goede voeding = betere prestaties.',mood:5,createdAt:new Date(Date.now()-3*86400000).toISOString()},
    ],
    habits:[
      {id:'h1',userId:'client-1',name:'Geen social media voor 10:00',phase:1,type:'eliminate',color:'#ef4444',active:true},
      {id:'h2',userId:'client-1',name:'Geen suiker in koffie',phase:1,type:'eliminate',color:'#ef4444',active:true},
      {id:'h3',userId:'client-1',name:'10 min meditatie',phase:2,type:'build',color:'#3b82f6',active:true},
      {id:'h4',userId:'client-1',name:'2L water per dag',phase:2,type:'build',color:'#3b82f6',active:true},
      {id:'h5',userId:'client-2',name:'Geen snacks na 20:00',phase:1,type:'eliminate',color:'#ef4444',active:true},
      {id:'h6',userId:'client-2',name:'Geen Netflix voor werk',phase:1,type:'eliminate',color:'#ef4444',active:true},
    ],
    habitCompletions: comps,
    trainingSessions:[
      {id:'t1',userId:'client-1',date:daysAgo(0),title:'Push Day',type:'krachttraining',duration:65,exercises:[{name:'Bench Press',sets:4,reps:8,weight:80},{name:'Overhead Press',sets:3,reps:10,weight:50},{name:'Dumbbell Flies',sets:3,reps:12,weight:16}],notes:'Goede sessie, bench voelde sterk.',energy:4},
      {id:'t2',userId:'client-1',date:daysAgo(2),title:'Pull Day',type:'krachttraining',duration:60,exercises:[{name:'Deadlift',sets:3,reps:5,weight:130},{name:'Pull-ups',sets:4,reps:8,weight:0},{name:'Barbell Row',sets:3,reps:10,weight:65}],notes:'PR op deadlift! 130kg.',energy:5},
      {id:'t3',userId:'client-1',date:daysAgo(4),title:'Leg Day',type:'krachttraining',duration:70,exercises:[{name:'Squat',sets:4,reps:6,weight:100},{name:'Romanian Deadlift',sets:3,reps:10,weight:70}],notes:'Zwaar maar goed.',energy:3},
    ],
    nutritionLogs:[
      {id:'n1',userId:'client-1',date:daysAgo(0),meals:[
        {id:'nm1',type:'ontbijt',name:'Havermout met bessen',calories:420,protein:32,carbs:58,fat:9},
        {id:'nm2',type:'lunch',name:'Kip met rijst en groenten',calories:580,protein:52,carbs:65,fat:12},
        {id:'nm3',type:'snack',name:'Griekse yoghurt',calories:220,protein:18,carbs:12,fat:10},
        {id:'nm4',type:'diner',name:'Zalm met aardappelen',calories:620,protein:48,carbs:55,fat:18},
      ],water:8,notes:'Goede dag.'},
    ],
    messages:[
      {id:'msg1',from:'coach-1',to:'client-1',content:'Hey Milan! Goed bezig deze week. Hoe voel je je bij fase 2? 💪',timestamp:new Date(Date.now()-7200000).toISOString(),read:true},
      {id:'msg2',from:'client-1',to:'coach-1',content:'Hey coach! Het gaat echt goed. Die meditatie begint te landen.',timestamp:new Date(Date.now()-3600000).toISOString(),read:true},
      {id:'msg3',from:'coach-1',to:'client-1',content:'Top! En dat PR op de deadlift — 130kg, respect! Volgende week kijken we naar fase 3.',timestamp:new Date(Date.now()-1800000).toISOString(),read:false},
    ],
  }
}

// ── Storage ──────────────────────────────────────────────────────────────────
const load = (k,fb) => { try { const v=localStorage.getItem(k); return v?JSON.parse(v):fb } catch { return fb } }
const save = (k,v) => { try { localStorage.setItem(k,JSON.stringify(v)) } catch {} }

// ── Context ──────────────────────────────────────────────────────────────────
const Ctx = createContext(null)
const useApp = () => useContext(Ctx)

function AppProvider({children}) {
  const seed = buildSeed()
  const [currentUser, setCurrentUser] = useState(() => {
    const cu = load('cu',null)
    // migrate old coach name
    if(cu && cu.id==='coach-1' && cu.name==='Yash') return {...cu,name:'Yasha Kul'}
    return cu
  })
  const [viewClientId, setViewClientId] = useState(null)
  const [users, setUsers] = useState(() => {
    const u = load('users', seed.users)
    // migrate old coach name in users list
    return u.map(x => x.id==='coach-1' && x.name==='Yash' ? {...x,name:'Yasha Kul'} : x)
  })
  const [journals, setJournals] = useState(() => load('journals', seed.journals))
  const [habits, setHabits] = useState(() => load('habits', seed.habits))
  const [habitComps, setHabitComps] = useState(() => load('hcomps', seed.habitCompletions))
  const [trainings, setTrainings] = useState(() => load('trainings', seed.trainingSessions))
  const [nutrition, setNutrition] = useState(() => load('nutrition', seed.nutritionLogs))
  const [messages, setMessages] = useState(() => load('messages', seed.messages))
  const [habitNotes, setHabitNotes] = useState(() => load('habitNotes', []))
  const [schemas, setSchemas] = useState(() => load('schemas', []))
  const [schemaAssignments, setSchemaAssignments] = useState(() => load('schemaAssignments', []))
  const [customFoods, setCustomFoods] = useState(() => load('customFoods', []))
  const [weightLogs, setWeightLogs] = useState(() => load('weightLogs', []))

  useEffect(()=>save('cu',currentUser),[currentUser])
  useEffect(()=>save('users',users),[users])
  useEffect(()=>save('journals',journals),[journals])
  useEffect(()=>save('habits',habits),[habits])
  useEffect(()=>save('hcomps',habitComps),[habitComps])
  useEffect(()=>save('trainings',trainings),[trainings])
  useEffect(()=>save('nutrition',nutrition),[nutrition])
  useEffect(()=>save('messages',messages),[messages])
  useEffect(()=>save('habitNotes',habitNotes),[habitNotes])
  useEffect(()=>save('schemas',schemas),[schemas])
  useEffect(()=>save('schemaAssignments',schemaAssignments),[schemaAssignments])
  useEffect(()=>save('customFoods',customFoods),[customFoods])
  useEffect(()=>save('weightLogs',weightLogs),[weightLogs])

  const activeId = viewClientId || currentUser?.id
  const activeUser = users.find(u=>u.id===activeId) || currentUser
  const clients = currentUser?.role==='coach' ? users.filter(u=>u.role==='client'&&u.coachId===currentUser.id) : []
  const myCoach = currentUser?.role==='client' ? users.find(u=>u.id===currentUser.coachId) : null

  const login = (email,pass) => {
    const u = users.find(u=>u.email===email&&u.password===pass)
    if(u){ setCurrentUser(u); return true }
    return false
  }
  const logout = () => { setCurrentUser(null); setViewClientId(null); localStorage.removeItem('cu') }

  const getJournals = (id=activeId) => journals.filter(j=>j.userId===id).sort((a,b)=>new Date(b.date)-new Date(a.date))
  const addJournal = e => { const n={...e,id:uid(),userId:activeId,createdAt:new Date().toISOString()}; setJournals(p=>[n,...p]); return n }
  const updateJournal = (id,u) => setJournals(p=>p.map(j=>j.id===id?{...j,...u}:j))
  const deleteJournal = id => setJournals(p=>p.filter(j=>j.id!==id))

  const getHabits = (id=activeId) => habits.filter(h=>h.userId===id&&h.active)
  const addHabit = h => { const n={...h,id:uid(),userId:activeId,active:true}; setHabits(p=>[...p,n]); return n }
  const deleteHabit = id => setHabits(p=>p.map(h=>h.id===id?{...h,active:false}:h))
  const toggleHabit = (habitId,date) => {
    const ex = habitComps.find(c=>c.habitId===habitId&&c.date===date&&c.userId===activeId)
    if(ex) setHabitComps(p=>p.filter(c=>!(c.habitId===habitId&&c.date===date&&c.userId===activeId)))
    else setHabitComps(p=>[...p,{id:uid(),habitId,userId:activeId,date}])
  }
  const isDone = (habitId,date) => habitComps.some(c=>c.habitId===habitId&&c.date===date&&c.userId===activeId)

  const getTrainings = (id=activeId) => trainings.filter(t=>t.userId===id).sort((a,b)=>new Date(b.date)-new Date(a.date))
  const addTraining = s => { const n={...s,id:uid(),userId:activeId,createdAt:new Date().toISOString()}; setTrainings(p=>[n,...p]); return n }
  const deleteTraining = id => setTrainings(p=>p.filter(t=>t.id!==id))

  const getNutrition = (id=activeId) => nutrition.filter(n=>n.userId===id).sort((a,b)=>new Date(b.date)-new Date(a.date))
  const getNutritionDay = (date,id=activeId) => nutrition.find(n=>n.userId===id&&n.date===date)||null
  const saveNutrition = log => {
    const ex = nutrition.find(n=>n.userId===activeId&&n.date===log.date)
    if(ex) setNutrition(p=>p.map(n=>n.id===ex.id?{...n,...log}:n))
    else setNutrition(p=>[...p,{...log,id:uid(),userId:activeId}])
  }

  const getMessages = (a,b) => messages.filter(m=>(m.from===a&&m.to===b)||(m.from===b&&m.to===a)).sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp))
  const sendMsg = (toId,content) => setMessages(p=>[...p,{id:uid(),from:currentUser.id,to:toId,content,timestamp:new Date().toISOString(),read:false}])
  const markRead = fromId => setMessages(p=>p.map(m=>m.from===fromId&&m.to===currentUser?.id?{...m,read:true}:m))
  const unreadFrom = fromId => messages.filter(m=>m.from===fromId&&m.to===currentUser?.id&&!m.read).length

  const addClient = data => {
    const n={...data,id:uid(),role:'client',coachId:currentUser.id,phase:1,avatar:initials(data.name),createdAt:new Date().toISOString()}
    setUsers(p=>[...p,n]); return n
  }
  const setPhase = (userId,phase) => setUsers(p=>p.map(u=>u.id===userId?{...u,phase}:u))
  const updateClient = (id,updates) => setUsers(p=>p.map(u=>u.id===id?{...u,...updates}:u))

  const getHabitNote = (habitId,date,userId=activeId) => habitNotes.find(n=>n.habitId===habitId&&n.date===date&&n.userId===userId)||null
  const saveHabitNote = (habitId,date,note) => {
    const ex = habitNotes.find(n=>n.habitId===habitId&&n.date===date&&n.userId===activeId)
    if(ex) setHabitNotes(p=>p.map(n=>n.id===ex.id?{...n,note}:n))
    else setHabitNotes(p=>[...p,{id:uid(),habitId,date,note,userId:activeId,createdAt:new Date().toISOString()}])
  }
  const getHabitNotes = (userId=activeId) => habitNotes.filter(n=>n.userId===userId)

  const addCustomFood = f => { const n={...f,id:uid(),userId:activeId,createdAt:new Date().toISOString()}; setCustomFoods(p=>[...p,n]); return n }
  const deleteCustomFood = id => setCustomFoods(p=>p.filter(f=>f.id!==id))
  const getCustomFoods = () => customFoods.filter(f=>f.userId===activeId).sort((a,b)=>a.name.localeCompare(b.name,'nl'))

  const updateCurrentUser = updates => {
    setCurrentUser(p=>({...p,...updates}))
    setUsers(p=>p.map(u=>u.id===currentUser?.id?{...u,...updates}:u))
  }

  const findUserByContact = id => {
    const s = id.trim()
    const digits = s.replace(/\D/g,'')
    return users.find(u => u.email===s || (u.phone && u.phone.replace(/\D/g,'')===digits && digits.length>=8))
  }
  const resetPassword = (userId, newPass) => setUsers(p=>p.map(u=>u.id===userId?{...u,password:newPass}:u))

  const addWeightLog = (weight, date=todayStr(), userId=activeId) => {
    const existing = weightLogs.find(l=>l.userId===userId&&l.date===date)
    if(existing) setWeightLogs(p=>p.map(l=>l.id===existing.id?{...l,weight:Number(weight)}:l))
    else setWeightLogs(p=>[...p,{id:uid(),userId,weight:Number(weight),date,createdAt:new Date().toISOString()}])
  }
  const getWeightLogs = (userId=activeId) => weightLogs.filter(l=>l.userId===userId).sort((a,b)=>a.date.localeCompare(b.date))
  const deleteWeightLog = id => setWeightLogs(p=>p.filter(l=>l.id!==id))

  const addSchema = s => { const n={...s,id:uid(),coachId:currentUser?.id,createdAt:new Date().toISOString()}; setSchemas(p=>[...p,n]); return n }
  const updateSchema = (id,u) => setSchemas(p=>p.map(s=>s.id===id?{...s,...u}:s))
  const deleteSchema = id => setSchemas(p=>p.filter(s=>s.id!==id))
  const assignSchema = (clientId,schemaId) => setSchemaAssignments(p=>[...p.filter(a=>a.clientId!==clientId),{id:uid(),clientId,schemaId,assignedAt:new Date().toISOString()}])
  const unassignSchema = clientId => setSchemaAssignments(p=>p.filter(a=>a.clientId!==clientId))
  const getClientSchema = (clientId=activeId) => { const a=schemaAssignments.find(a=>a.clientId===clientId); return a?schemas.find(s=>s.id===a.schemaId)||null:null }
  const getCoachSchemas = () => schemas.filter(s=>s.coachId===currentUser?.id)

  return <Ctx.Provider value={{
    currentUser, activeUser, activeId, viewClientId, setViewClientId,
    users, clients, myCoach, login, logout,
    getJournals, addJournal, updateJournal, deleteJournal,
    getHabits, addHabit, deleteHabit, toggleHabit, isDone, habitComps,
    getTrainings, addTraining, deleteTraining,
    getNutrition, getNutritionDay, saveNutrition,
    getMessages, sendMsg, markRead, unreadFrom,
    addClient, setPhase, updateClient,
    getHabitNote, saveHabitNote, getHabitNotes,
    addCustomFood, deleteCustomFood, getCustomFoods,
    addWeightLog, getWeightLogs, deleteWeightLog,
    findUserByContact, resetPassword, updateCurrentUser,
    addSchema, updateSchema, deleteSchema, assignSchema, unassignSchema, getClientSchema, getCoachSchemas,
  }}>{children}</Ctx.Provider>
}

// ── SVG Icons ────────────────────────────────────────────────────────────────
const I = ({d,s=16,fill="none",sw=2,...p}) => <svg width={s} height={s} viewBox="0 0 24 24" fill={fill} stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" {...p}>{[].concat(d).map((x,i)=><path key={i} d={x}/>)}</svg>
const icons = {
  grid:      "M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",
  cols:      ["M12 3h8v18h-8zM4 3h6v18H4z","M4 3h6v18H4z","M12 3h8v18h-8z"],
  book:      "M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z",
  check:     ["M9 11l3 3L22 4","M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"],
  dumbbell:  ["M6.5 6.5 17.5 17.5","M17.5 6.5 6.5 17.5","M3 3.5 6.5 7","M17.5 17 21 20.5","M3.5 20.5 7 17","M17 7 20.5 3.5"],
  fork:      ["M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2","M7 2v20","M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"],
  chat:      ["M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"],

// ── Avatar helper (photo or coloured initials) ───────────────────────────────
function AvatarImg({user, className='w-8 h-8 rounded-full', textClass='text-xs', style={}}) {
  if (user?.avatarImg) {
    return <img src={user.avatarImg} alt={user?.name||'avatar'}
      className={`${className} object-cover flex-shrink-0`} style={style}/>
  }
  return (
    <div className={`${className} flex items-center justify-center font-bold text-white flex-shrink-0`}
      style={{backgroundColor:user?.avatarColor||'#3b82f6', ...style}}>
      <span className={textClass}>{initials(user?.name)}</span>
    </div>
  )
}

function drawMountainOnCanvas(canvas, r, g, b) {
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = function() {
    const tmp = document.createElement('canvas');
    tmp.width = img.width; tmp.height = img.height;
    const tctx = tmp.getContext('2d');
    tctx.drawImage(img, 0, 0);
    const data = tctx.getImageData(0, 0, tmp.width, tmp.height);
    const px = data.data, W = tmp.width, H = tmp.height, threshold = 200;
    for (let i = 0; i < px.length; i += 4) {
      const bright = (px[i] + px[i+1] + px[i+2]) / 3;
      if (bright > threshold) { px[i+3] = 0; }
      else {
        const alpha = Math.min(255, Math.round((1 - bright/threshold) * 330));
        px[i] = r; px[i+1] = g; px[i+2] = b; px[i+3] = alpha;
      }
    }
    tctx.putImageData(data, 0, 0);
    let minX=W,maxX=0,minY=H,maxY=0;
    const raw = tctx.getImageData(0,0,W,H).data;
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){
      const a=raw[((y*W)+x)*4+3];
      if(a>10){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
    }
    const cw=maxX-minX+1, ch=maxY-minY+1;
    canvas.width=cw; canvas.height=ch;
    ctx.drawImage(tmp,minX,minY,cw,ch,0,0,cw,ch);
  };
  img.src = MTNIMG;
}

function KaizenLogo({ variant='login' }) {

function Login() {
  const {login, findUserByContact, resetPassword} = useApp()

  const [view,setView]         = useState('login')
  const [email,setEmail]       = useState('')
  const [pass,setPass]         = useState('')
  const [showPass,setShowPass] = useState(false)
  const [err,setErr]           = useState('')
  const [loading,setLoading]   = useState(false)

  // forgot-password state
  const [contact,setContact]   = useState('')
  const [foundUser,setFoundUser] = useState(null)
  const [newPass,setNewPass]   = useState('')
  const [newPass2,setNewPass2] = useState('')
  const [showNew,setShowNew]   = useState(false)
  const [fpErr,setFpErr]       = useState('')

  const submit = e => {
    e.preventDefault(); setLoading(true); setErr('')
    setTimeout(()=>{ if(!login(email.trim(),pass)) setErr('Ongeldig e-mailadres of wachtwoord.'); setLoading(false) },400)
  }
  const fill = (e,p) => { setEmail(e); setPass(p); setErr('') }

  const lookupContact = () => {
    setFpErr('')
    if(!contact.trim()) return setFpErr('Vul een e-mailadres of telefoonnummer in.')
    const u = findUserByContact(contact)
    if(!u) return setFpErr('Geen account gevonden met dit e-mailadres of telefoonnummer.')
    setFoundUser(u); setView('reset')
  }

  const doReset = () => {
    setFpErr('')
    if(newPass.length < 4) return setFpErr('Wachtwoord moet minimaal 4 tekens zijn.')
    if(newPass !== newPass2) return setFpErr('Wachtwoorden komen niet overeen.')
    resetPassword(foundUser.id, newPass)
    setView('done')
  }

  const backToLogin = () => { setView('login'); setContact(''); setNewPass(''); setNewPass2(''); setFoundUser(null); setFpErr('') }

  return <div className="min-h-screen bg-gray-950 flex items-center justify-center p-4">
    <div className="w-full max-w-md">
      <div className="flex justify-center mb-8">
        <KaizenLogo variant="login"/>
      </div>

      {/* ── Login ── */}
      {view==='login' && <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8">
        <h2 className="text-xl font-bold text-white mb-1">Welkom terug</h2>
        <p className="text-gray-400 text-sm mb-7">Log in om je dashboard te bekijken</p>
        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">E-mailadres</label>

              className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-700"/>
          </div>
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <label className="block text-xs text-gray-400 uppercase tracking-wider font-medium">Wachtwoord</label>
              <button type="button" onClick={()=>{ setView('forgot'); setErr('') }}

                <Icon name={showPass?'eyeoff':'eye'} size={16}/>

          {err && <p className="text-red-400 text-sm bg-red-400/10 border border-red-400/20 rounded-lg px-3 py-2">{err}</p>}
          <button type="submit" disabled={loading}
            className="w-full bg-blue-700 hover:bg-blue-800 disabled:opacity-60 text-white font-bold rounded-xl py-3 transition-colors mt-2">

          {fpErr && <p className="text-red-400 text-sm bg-red-400/10 border border-red-400/20 rounded-lg px-3 py-2">{fpErr}</p>}
          <button onClick={lookupContact}
            className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl py-3 transition-colors">
            Account opzoeken
          </button>
        </div>
      </div>}

      {/* ── Wachtwoord vergeten — stap 2: nieuw wachtwoord ── */}
      {view==='reset' && foundUser && <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8">
        <button onClick={()=>setView('forgot')} className="flex items-center gap-1.5 text-gray-500 hover:text-white text-sm mb-6 transition-colors">
          <Icon name="chevL" size={14}/> Terug
        </button>
        <h2 className="text-xl font-bold text-white mb-1">Nieuw wachtwoord</h2>
        <div className="flex items-center gap-2.5 bg-blue-700/10 border border-blue-700/20 rounded-xl px-4 py-3 mb-6">
          <div className="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
            style={{backgroundColor:foundUser.avatarColor||'#3b82f6'}}>
            {initials(foundUser.name)}
          </div>
          <div>
            <p className="text-sm font-semibold text-white">{foundUser.name}</p>
            <p className="text-xs text-gray-400">{foundUser.email}</p>
          </div>
        </div>
        <div className="space-y-4">
          <div>
            <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Nieuw wachtwoord</label>
            <div className="relative">
              <input type={showNew?'text':'password'} value={newPass} onChange={e=>{setNewPass(e.target.value);setFpErr('')}}
                placeholder="Minimaal 4 tekens"
                onKeyDown={e=>e.key==='Enter'&&doReset()}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 pr-11 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-700"/>
              <button type="button" onClick={()=>setShowNew(v=>!v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                <Icon name={showNew?'eyeoff':'eye'} size={16}/>
              </button>
            </div>
          </div>
          <div>
            <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Herhaal wachtwoord</label>
            <input type={showNew?'text':'password'} value={newPass2} onChange={e=>{setNewPass2(e.target.value);setFpErr('')}}
              placeholder="Zelfde wachtwoord"
              onKeyDown={e=>e.key==='Enter'&&doReset()}
              className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-700"/>
          </div>
          {fpErr && <p className="text-red-400 text-sm bg-red-400/10 border border-red-400/20 rounded-lg px-3 py-2">{fpErr}</p>}
          <button onClick={doReset}
            className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl py-3 transition-colors">
            Wachtwoord opslaan
          </button>
        </div>
      </div>}

      {/* ── Done ── */}
      {view==='done' && <div className="bg-gray-900 border border-gray-800 rounded-2xl p-8 text-center">
        <div className="w-16 h-16 bg-green-500/15 rounded-full flex items-center justify-center mx-auto mb-5">
          <Icon name="check2" size={28} className="text-green-400"/>
        </div>
        <h2 className="text-xl font-bold text-white mb-2">Wachtwoord gewijzigd</h2>
        <p className="text-gray-400 text-sm mb-7">Je kunt nu inloggen met je nieuwe wachtwoord.</p>
        <button onClick={backToLogin}
          className="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl py-3 transition-colors">
          Terug naar inloggen
        </button>
      </div>}

    </div>
  </div>
}

// ── AccountSettings modal ─────────────────────────────────────────────────────
function AccountSettings({onClose}) {
  const {currentUser, updateCurrentUser, users, logout} = useApp()
  const [name,    setName]    = useState(currentUser?.name    || '')
  const [email,   setEmail]   = useState(currentUser?.email   || '')
  const [curPass, setCurPass] = useState('')
  const [newPass, setNewPass] = useState('')
  const [newPass2,setNewPass2]= useState('')
  const [showCur, setShowCur] = useState(false)
  const [showNew, setShowNew] = useState(false)
  const [err,     setErr]     = useState('')
  const [saved,   setSaved]   = useState(false)
  const [avatarColor,   setAvatarColor]   = useState(currentUser?.avatarColor || '#1d4ed8')
  const [avatarImg,     setAvatarImg]     = useState(currentUser?.avatarImg   || '')
  const [showColorPick, setShowColorPick] = useState(false)
  const fileRef = useRef(null)

  const handleFile = e => {
    const file = e.target.files?.[0]
    if (!file) return
    if (file.size > 3 * 1024 * 1024) return setErr('Foto mag maximaal 3 MB zijn.')
    const reader = new FileReader()
    reader.onload = ev => { setAvatarImg(ev.target.result); setShowColorPick(false); setSaved(false) }
    reader.readAsDataURL(file)
    e.target.value = ''
  }

  const save = () => {
    setErr('')
    if(!name.trim())  return setErr('Naam mag niet leeg zijn.')
    if(!email.trim()) return setErr('E-mailadres mag niet leeg zijn.')
    // Email already taken by another user?
    if(users.some(u=>u.email===email.trim()&&u.id!==currentUser?.id))
      return setErr('Dit e-mailadres is al in gebruik.')
    const updates = {name:name.trim(), email:email.trim(), avatarColor, avatarImg}
    if(newPass) {
      if(curPass !== currentUser?.password) return setErr('Huidig wachtwoord klopt niet.')
      if(newPass.length < 4) return setErr('Nieuw wachtwoord minimaal 4 tekens.')
      if(newPass !== newPass2) return setErr('Nieuwe wachtwoorden komen niet overeen.')
      updates.password = newPass
    }
    updateCurrentUser(updates)
    setSaved(true)
    setTimeout(()=>{ setSaved(false); onClose() }, 1200)
  }

  return (
    <div className="fixed flex items-end md:items-center justify-center p-0 md:p-4"
      style={{top:0,left:0,width:'100vw',height:'100vh',zIndex:200,background:'rgba(0,0,0,0.75)',backdropFilter:'blur(4px)'}}>
      <div className="w-full md:max-w-md bg-gray-900 border border-gray-800 rounded-t-3xl md:rounded-2xl flex flex-col"
        style={{maxHeight:'85vh'}}>
        {/* Header */}
        <div className="flex items-center justify-between px-6 pt-6 pb-4 border-b border-gray-800">
          <div>
            <h2 className="text-lg font-bold text-white">Account instellingen</h2>
            <p className="text-xs text-gray-500 mt-0.5">Wijzig je naam, e-mail of wachtwoord</p>
          </div>
          <button onClick={onClose} className="p-2 text-gray-500 hover:text-white hover:bg-gray-800 rounded-xl transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div className="flex-1 overflow-y-auto px-6 py-5 space-y-5">
          {/* Avatar preview */}
          <div className="flex items-center gap-4">
            <div className="relative flex-shrink-0">
              {avatarImg
                ? <img src={avatarImg} alt="avatar" className="w-16 h-16 rounded-2xl object-cover"/>
                : <div className="w-16 h-16 rounded-2xl flex items-center justify-center text-lg font-bold text-white"
                    style={{backgroundColor:avatarColor}}>
                    {initials(name||currentUser?.name)}
                  </div>
              }
              {/* Brush button */}
              <button onClick={()=>setShowColorPick(p=>!p)}
                className="absolute -bottom-1.5 -right-1.5 w-7 h-7 rounded-full flex items-center justify-center border-2 border-gray-900 transition-colors"
                style={{backgroundColor:showColorPick?'#3b82f6':'#374151'}}
                title="Profielfoto wijzigen">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3z"/>
                  <path d="M8.9 16.11c-1.4 1.4-3.15 2.3-5.16 2.58.28-2.02 1.18-3.77 2.57-5.16"/>
                </svg>
              </button>
              {/* Hidden file input */}
              <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={handleFile}/>
              {/* Picker popover */}
              {showColorPick && (
                <div className="absolute left-0 top-full mt-3 bg-gray-800 border border-gray-700 rounded-2xl p-3 shadow-2xl" style={{zIndex:300,width:'210px'}}>
                  {/* Upload foto */}
                  <button onClick={()=>fileRef.current?.click()}
                    className="w-full flex items-center gap-2 text-xs text-gray-200 hover:text-white bg-gray-700 hover:bg-gray-600 rounded-xl px-3 py-2 mb-2 transition-colors">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Foto uploaden
                  </button>
                  {/* Verwijder foto (only shown if photo is set) */}
                  {avatarImg && <button onClick={()=>{setAvatarImg('');setSaved(false)}}
                    className="w-full flex items-center gap-2 text-xs text-red-400 hover:text-red-300 bg-gray-700 hover:bg-gray-600 rounded-xl px-3 py-2 mb-2.5 transition-colors">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                    Foto verwijderen
                  </button>}
                  {/* Kleur kiezen */}
                  <p className="text-xs text-gray-500 mb-2 font-semibold uppercase tracking-wider">Of kies een kleur</p>
                  <div className="grid grid-cols-5 gap-2">
                    {['#3b82f6','#6366f1','#8b5cf6','#a855f7','#ec4899',
                      '#f97316','#f59e0b','#10b981','#14b8a6','#06b6d4',
                      '#ef4444','#e11d48','#84cc16','#0ea5e9','#1d4ed8'].map(c=>(
                      <button key={c} onClick={()=>{setAvatarColor(c);setAvatarImg('');setShowColorPick(false);setSaved(false)}}
                        className="w-8 h-8 rounded-xl transition-transform hover:scale-110 flex items-center justify-center"
                        style={{backgroundColor:c, boxShadow:(!avatarImg&&avatarColor===c)?'0 0 0 2px #fff':undefined}}>
                        {!avatarImg&&avatarColor===c && <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3"><path d="M20 6L9 17l-5-5"/></svg>}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
            <div>
              <p className="text-sm font-semibold text-white">{name||currentUser?.name}</p>
              <p className="text-xs text-gray-500">{currentUser?.role==='coach'?'Coach':'Klant'}</p>
              <p className="text-xs text-blue-400 mt-0.5">Tik op het penseeltje om de kleur te wijzigen</p>
            </div>
          </div>

          {/* Persoonlijk */}
          <div className="space-y-3">
            <p className="text-xs text-gray-500 uppercase tracking-widest font-semibold">Persoonlijk</p>
            <div>
              <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Naam</label>
              <input type="text" value={name} onChange={e=>{setName(e.target.value);setErr('');setSaved(false)}}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-600"/>
            </div>
            <div>
              <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">E-mailadres</label>
              <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr('');setSaved(false)}}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-600"/>
            </div>
          </div>

          {/* Wachtwoord wijzigen */}
          <div className="space-y-3">
            <p className="text-xs text-gray-500 uppercase tracking-widest font-semibold">Wachtwoord wijzigen <span className="normal-case text-gray-600">(optioneel)</span></p>
            <div>
              <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Huidig wachtwoord</label>
              <div className="relative">
                <input type={showCur?'text':'password'} value={curPass} onChange={e=>{setCurPass(e.target.value);setErr('')}}
                  placeholder="Vul huidig wachtwoord in"
                  className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 pr-10 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-600"/>
                <button type="button" onClick={()=>setShowCur(v=>!v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                  <Icon name={showCur?'eyeoff':'eye'} size={15}/>
                </button>
              </div>
            </div>
            <div>
              <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Nieuw wachtwoord</label>
              <div className="relative">
                <input type={showNew?'text':'password'} value={newPass} onChange={e=>{setNewPass(e.target.value);setErr('')}}
                  placeholder="Minimaal 4 tekens"
                  className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 pr-10 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-600"/>
                <button type="button" onClick={()=>setShowNew(v=>!v)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-300">
                  <Icon name={showNew?'eyeoff':'eye'} size={15}/>
                </button>
              </div>
            </div>
            {newPass && <div>
              <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Herhaal nieuw wachtwoord</label>
              <input type={showNew?'text':'password'} value={newPass2} onChange={e=>{setNewPass2(e.target.value);setErr('')}}
                placeholder="Zelfde wachtwoord"
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-600"/>
            </div>}
          </div>

          {err   && <p className="text-red-400 text-sm bg-red-400/10 border border-red-400/20 rounded-xl px-4 py-2.5">{err}</p>}
          {saved && <p className="text-green-400 text-sm bg-green-400/10 border border-green-400/20 rounded-xl px-4 py-2.5">✓ Opgeslagen!</p>}
        </div>

        {/* Sticky footer */}
        <div className="flex-shrink-0 px-6 py-4 border-t border-gray-800 space-y-3"
          style={{paddingBottom:'calc(1rem + env(safe-area-inset-bottom))'}}>
          <div className="flex gap-3">
            <button onClick={save}
              className="flex-1 bg-blue-700 hover:bg-blue-600 text-white font-bold rounded-xl py-3 text-sm transition-colors">
              {saved ? '✓ Opgeslagen' : 'Opslaan'}
            </button>
            <button onClick={onClose}
              className="px-5 text-gray-400 hover:text-white hover:bg-gray-800 rounded-xl py-3 text-sm transition-colors">
              Annuleer
            </button>
          </div>
          <button onClick={()=>{onClose();logout()}}
            className="w-full flex items-center justify-center gap-2 text-red-400 hover:text-red-300 hover:bg-red-500/10 rounded-xl py-2.5 text-sm transition-colors">
            <Icon name="logout" size={14}/>
            Uitloggen
          </button>
        </div>
      </div>
    </div>
  )
}

// ── Sidebar ──────────────────────────────────────────────────────────────────
const NAV = [
  {id:'clients',label:'Klanten',icon:'users',coachOnly:true},
  {id:'schemas',label:"Schema's",icon:'schema',coachOnly:true},
  {id:'overview',label:'Dashboard',icon:'grid'},
  {id:'pillars',label:'De 3 Pilaren',icon:'temple'},
  {id:'journal',label:'Journal',icon:'book'},
  {id:'habits',label:'Gewoontes',icon:'check'},
  {id:'training',label:'Training',icon:'dumbbell'},
  {id:'nutrition',label:'Voeding',icon:'fork'},
  {id:'progress',label:'Voortgang',icon:'trend'},
  {id:'contact',label:'WhatsApp',icon:'chat'},
]

  const {currentUser,activeUser,viewClientId,setViewClientId} = useApp()

  const clickNav = id => {
    if(isCoach && !viewClientId && id!=='clients' && id!=='schemas') return
    setPage(id)
  }

  return <aside className="sidebar-nav hidden md:flex flex-col w-56 min-h-screen border-r flex-shrink-0">
    <div className="px-4 py-4 border-b border-gray-800">
      <KaizenLogo variant="sidebar"/>
    </div>

    {isCoach && viewClientId && <div className="mx-3 mt-3 p-2.5 rounded-xl bg-blue-500/10 border border-blue-500/20">
      <div className="flex items-center gap-2">
        <div className="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold text-white flex-shrink-0"
          style={{backgroundColor:activeUser?.avatarColor||'#3b82f6'}}>
          {initials(activeUser?.name)}
        </div>
        <div className="min-w-0">
          <p className="text-xs text-blue-300 font-medium truncate">{activeUser?.name}</p>
          <p className="text-xs text-gray-500">{phaseName(activeUser?.phase)}</p>
        </div>
      </div>
      <button onClick={()=>{setViewClientId(null);setPage('clients')}}
        className="flex items-center gap-1 mt-2 text-xs text-gray-400 hover:text-white">
        <Icon name="chevL" size={11}/> Terug
      </button>
    </div>}

    <nav className="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      {NAV.filter(n=>!n.coachOnly||isCoach).map(({id,label,icon})=>{
        const disabled = isCoach && !viewClientId && id!=='clients' && id!=='schemas'
        const active = page===id
        return <button key={id} onClick={()=>!disabled&&clickNav(id)} disabled={disabled}
          className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all relative
            ${active?'bg-blue-700/15 text-blue-400 border border-blue-700/20':disabled?'text-gray-700 cursor-default':'text-gray-400 hover:text-white hover:bg-gray-800'}`}>
          <Icon name={icon} size={15} className={active?'text-blue-400':''}/>
          {label}
        </button>
      })}
    </nav>

    <div className="border-t border-gray-800 p-3">
      <div className="flex items-center gap-2 px-2 py-2">
        <button onClick={onSettings}
          className="flex items-center gap-2 flex-1 min-w-0 rounded-xl hover:bg-gray-800 p-1 -m-1 transition-colors text-left">
          <AvatarImg user={currentUser} className="w-8 h-8 rounded-full" textClass="text-xs"/>
          <div className="flex-1 min-w-0">
            <p className="text-sm font-medium text-white truncate">{currentUser?.name}</p>
            <p className="text-xs text-gray-500">{currentUser?.role==='coach'?'Coach':'Klant'}</p>
          </div>
        </button>
        <button onClick={onSettings} className="p-1.5 text-gray-500 hover:text-white rounded-lg transition-colors" title="Instellingen">
          <Icon name="gear" size={14}/>
        </button>
        <button onClick={useApp().logout} className="p-1.5 text-gray-500 hover:text-red-400 rounded-lg transition-colors" title="Uitloggen">
          <Icon name="logout" size={14}/>
        </button>
      </div>
    </div>
  </aside>
}

// ── Overview ─────────────────────────────────────────────────────────────────
function Overview({setPage}) {
  const {activeUser,getJournals,getHabits,getTrainings,isDone,habitComps,activeId} = useApp()
  const journals=getJournals(), habits=getHabits(), sessions=getTrainings()
  const td=todayStr()
  const weekSessions=sessions.filter(s=>(new Date()-new Date(s.date+'T12:00:00'))/86400000<=7).length
  const doneToday=habits.filter(h=>isDone(h.id,td)).length
  const bestStreak=habits.length?Math.max(...habits.map(h=>calcStreak(habitComps.filter(c=>c.userId===activeId),h.id))):0
  const phase=activeUser?.phase||1
  const color=phaseColor(phase)

  return <div className="p-6 space-y-6 max-w-4xl">
    <div>
      <h1 className="text-2xl font-bold text-white">Hey {activeUser?.name?.split(' ')[0]} 👋</h1>
      <p className="text-gray-400 text-sm mt-1">{new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long'})}</p>
    </div>

    <div className="rounded-2xl p-5 border" style={{background:`linear-gradient(135deg,${color}18 0%,transparent 60%)`,borderColor:`${color}30`}}>
      <div className="flex items-center justify-between flex-wrap gap-4">
        <div>
          <p className="text-xs uppercase tracking-widest font-medium mb-1" style={{color}}>Huidige fase</p>
          <h2 className="text-3xl font-black text-white">{phaseName(phase)}</h2>
          <p className="text-gray-400 text-sm mt-1">{phaseDesc(phase)}</p>
        </div>
        <div className="flex gap-1">{[1,2,3].map(p=><div key={p} className="w-8 h-2 rounded-full" style={{backgroundColor:p<=phase?phaseColor(phase):'#374151'}}/>)}</div>
      </div>
    </div>

    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
      {[
        {icon:'check',label:'Gewoontes vandaag',val:`${doneToday}/${habits.length}`,sub:`${habits.length>0?Math.round(doneToday/habits.length*100):0}% voltooid`,c:'#1d4ed8'},
        {icon:'flame',label:'Beste streak',val:`${bestStreak}d`,sub:'aaneengesloten',c:'#ef4444'},
        {icon:'dumbbell',label:'Trainingen',val:weekSessions,sub:'afgelopen 7d',c:'#3b82f6'},
        {icon:'book',label:'Journal entries',val:journals.length,sub:'totaal',c:'#8b5cf6'},
      ].map(({icon,label,val,sub,c})=><div key={label} className="bg-gray-900 border border-gray-800 rounded-2xl p-4">
        <div className="p-2 rounded-lg inline-flex mb-3" style={{backgroundColor:`${c}15`,color:c}}><Icon name={icon} size={16}/></div>
        <p className="text-2xl font-bold text-white">{val}</p>
        <p className="text-xs text-gray-400 mt-0.5">{label}</p>
        <p className="text-xs text-gray-600 mt-0.5">{sub}</p>
      </div>)}
    </div>

    <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div className="bg-gray-900 border border-gray-800 rounded-2xl p-5">
        <div className="flex items-center justify-between mb-4">
          <h3 className="font-semibold text-white">Gewoontes vandaag</h3>

// ── Pillars ───────────────────────────────────────────────────────────────────
function Pillars() {
  const {activeUser,getHabits,habitComps,activeId,setPhase,currentUser} = useApp()
  const habits=getHabits()
  const phase=activeUser?.phase||1
  const isCoach=currentUser?.role==='coach'
  const DEFS=[
    {p:1,icon:'flame',title:'Reset',sub:'FASE 1',desc:'Identificeer de gewoontes die je tegenhouden en elimineer ze stap voor stap.',steps:['Slechte gewoontes identificeren','Triggers en patronen herkennen','Vervangende strategieën opstellen','Consistent toepassen']},
    {p:2,icon:'hammer',title:'Build',sub:'FASE 2',desc:'Met de vrijgekomen ruimte bouw je krachtige nieuwe gewoontes op die aansluiten bij jouw doelen.',steps:['Goede gewoontes definiëren','Klein beginnen, consistent schalen','Habit stacking toepassen','Routines en systemen bouwen']},
    {p:3,icon:'crown',title:'Dominate',sub:'FASE 3',desc:'De aangeleerde gewoontes worden onderdeel van wie je bent. Levenslange verandering begint hier.',steps:['Gewoontes automatiseren','Identiteit verankeren','Tegenslagen overwinnen','Levenslang volhouden']},
  ]

  return <div className="p-6 space-y-8 max-w-5xl">
    <div>
      <h1 className="text-2xl font-bold text-white">De 3 Pilaren</h1>
      <p className="text-gray-400 text-sm mt-1">Het stappenplan naar een beter leven</p>
    </div>

    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
      {DEFS.map(({p,icon,title,sub,desc,steps})=>{
        const active=p===phase, done=p<phase, color=phaseColor(p)
        const phaseHabits=habits.filter(h=>h.phase===p)
        const streak=phaseHabits.length?Math.max(...phaseHabits.map(h=>calcStreak(habitComps.filter(c=>c.userId===activeId),h.id))):0
        return <div key={p} className={`relative rounded-2xl border p-6 transition-all duration-300 ${active?'md:-translate-y-2':done?'opacity-80':'opacity-40'}`}
          style={{background:active?`linear-gradient(180deg,${color}20 0%,transparent 100%)`:`linear-gradient(180deg,${color}08 0%,transparent 100%)`,
            borderColor:active?color:done?`${color}40`:'#374151',borderTopWidth:active?'3px':'1px'}}>
          {active&&<div className="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full text-xs font-bold text-white" style={{backgroundColor:color}}>ACTIEF</div>}
          {done&&<div className="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full text-xs font-bold text-white bg-green-500">VOLTOOID ✓</div>}
          <div className="w-14 h-14 rounded-2xl flex items-center justify-center mb-4" style={{backgroundColor:`${color}20`,color}}><Icon name={icon} size={26}/></div>
          <p className="text-xs font-bold tracking-widest mb-1" style={{color}}>{sub}</p>
          <h3 className="text-2xl font-black text-white mb-3">{title}</h3>
          <p className="text-sm text-gray-400 mb-5 leading-relaxed">{desc}</p>
          <div className="space-y-2 mb-5">
            {steps.map((s,i)=><div key={i} className="flex items-start gap-2">
              {done||(active&&i<2)?<Icon name="check2" size={14} className="mt-0.5 flex-shrink-0" style={{color}}/>:<Icon name="circle" size={14} className="mt-0.5 flex-shrink-0 text-gray-700"/>}
              <span className={`text-xs ${done||(active&&i<2)?'text-gray-300':'text-gray-600'}`}>{s}</span>
            </div>)}
          </div>
          {phaseHabits.length>0&&<div className="border-t pt-4" style={{borderColor:`${color}20`}}>
            <p className="text-xs text-gray-500 mb-2">{phaseHabits.length} gewoonte{phaseHabits.length!==1?'s':''}
              {streak>0&&<span className="ml-2" style={{color}}>🔥 {streak}d streak</span>}
            </p>
            {phaseHabits.slice(0,3).map(h=><div key={h.id} className="flex items-center gap-1.5 text-xs text-gray-400 mb-1">
              <div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor:h.color}}/>{h.name}
            </div>)}
          </div>}
          {isCoach&&active&&p<3&&<button onClick={()=>setPhase(activeUser.id,p+1)}
            className="mt-4 w-full flex items-center justify-center gap-2 py-2.5 rounded-xl text-xs font-bold transition-all hover:opacity-90"
            style={{backgroundColor:`${color}20`,color,border:`1px solid ${color}30`}}>
            Promoveer naar {phaseName(p+1)} <Icon name="chevR" size={13}/>
          </button>}
        </div>
      })}
    </div>

    <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6">
      <h3 className="font-semibold text-white mb-5">Jouw reis</h3>
      <div className="flex items-center gap-2">
        {[1,2,3].map((p,i)=><React.Fragment key={p}>
          <div className="flex flex-col items-center">
            <div className="w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm"
              style={{backgroundColor:p<=phase?phaseColor(p):'#1f2937',color:p<=phase?'white':'#6b7280',
                boxShadow:p===phase?`0 0 15px ${phaseColor(p)}50`:'none'}}>
              {p<phase?'✓':p}
            </div>
            <p className="text-xs font-medium mt-1.5" style={{color:p<=phase?phaseColor(p):'#6b7280'}}>{phaseName(p)}</p>
          </div>
          {i<2&&<div className="flex-1 h-0.5 mb-4 rounded" style={{backgroundColor:p<phase?phaseColor(p):'#374151'}}/>}
        </React.Fragment>)}
      </div>
    </div>
  </div>
}

// ── Journal ───────────────────────────────────────────────────────────────────
const MOODS=[{v:1,e:'😔'},{v:2,e:'😕'},{v:3,e:'😐'},{v:4,e:'😊'},{v:5,e:'😄'}]
const emptyJ = () => ({id:null,date:todayStr(),title:'',content:'',learnings:'',mood:3})

function Journal() {
  const {getJournals,addJournal,updateJournal,deleteJournal} = useApp()
  const journals=getJournals()
  const [sel,setSel] = useState(journals[0]||null)
  const [editing,setEditing] = useState(false)
  const [form,setForm] = useState(emptyJ())
  const [isNew,setIsNew] = useState(false)

  const startNew = () => { setForm(emptyJ()); setSel(null); setEditing(true); setIsNew(true) }
  const select = j => { setSel(j); setEditing(false); setIsNew(false) }
  const save = () => {
    if(!form.title.trim()) return
    if(isNew) { const n=addJournal({...form,id:undefined}); setSel(n) }
    else { updateJournal(form.id,form); setSel({...sel,...form}) }
    setEditing(false); setIsNew(false)
  }
  const remove = j => {
    deleteJournal(j.id); const rem=journals.filter(x=>x.id!==j.id)
    setSel(rem[0]||null); setEditing(false)
  }
  const f = (k,v) => setForm(p=>({...p,[k]:v}))

  return <div className="flex" style={{minHeight:'calc(100vh - 56px)'}}>
    <div className="w-64 flex-shrink-0 border-r border-gray-800 bg-gray-900 flex flex-col">
      <div className="flex items-center justify-between p-4 border-b border-gray-800">
        <h2 className="font-semibold text-white text-sm">Journal</h2>
        <button onClick={startNew} className="flex items-center gap-1 bg-blue-700 hover:bg-blue-800 text-white text-xs font-bold px-2.5 py-1.5 rounded-lg">
          <Icon name="plus" size={12}/> Nieuw
        </button>
      </div>
      <div className="flex-1 overflow-y-auto">
        {journals.length===0?<div className="p-6 text-center"><Icon name="book" size={32} className="text-gray-700 mx-auto mb-2"/><p className="text-gray-500 text-sm">Nog geen entries.</p></div>:
          journals.map(j=><button key={j.id} onClick={()=>select(j)}
            className={`w-full text-left px-4 py-3 border-b border-gray-800 hover:bg-gray-800 ${sel?.id===j.id?'bg-gray-800 border-l-2 border-l-blue-600':''}`}>
            <div className="flex items-center gap-2 mb-1">
              <span className="text-xs text-gray-500">{fmtShort(j.date)}</span>
              <div className="w-2 h-2 rounded-full" style={{backgroundColor:moodColor(j.mood)}}/>
            </div>
            <p className="text-sm font-medium text-white truncate">{j.title}</p>
            <p className="text-xs text-gray-500 truncate mt-0.5">{j.content}</p>
          </button>)}
      </div>
    </div>
    <div className="flex-1 overflow-y-auto bg-gray-950">
      {editing?<div className="max-w-2xl mx-auto p-8">
        <h2 className="text-xl font-bold text-white mb-6">{isNew?'Nieuwe entry':'Bewerken'}</h2>
        <div className="space-y-5">
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Datum</label>
              <input type="date" value={form.date} onChange={e=>f('date',e.target.value)}
                className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:border-blue-700"/>
            </div>
            <div>
              <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Stemming</label>
              <div className="flex gap-1">
                {MOODS.map(m=><button key={m.v} onClick={()=>f('mood',m.v)}
                  className={`flex-1 py-2 rounded-xl text-lg ${form.mood===m.v?'bg-gray-700 ring-2 ring-blue-600':'bg-gray-800 hover:bg-gray-700'}`}>{m.e}</button>)}
              </div>
            </div>
          </div>
          <div>
            <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Titel</label>
            <input type="text" value={form.title} onChange={e=>f('title',e.target.value)} placeholder="Geef je entry een titel..."
              className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-700"/>
          </div>
          <div>
            <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Hoe was je dag?</label>
            <textarea value={form.content} onChange={e=>f('content',e.target.value)} rows={6} placeholder="Beschrijf je dag, ervaringen, gedachten..."
              className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-700 resize-none"/>
          </div>
          <div>
            <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">💡 Leermoment <span className="text-gray-600 normal-case">(optioneel)</span></label>
            <textarea value={form.learnings} onChange={e=>f('learnings',e.target.value)} rows={3} placeholder="Wat heb je vandaag geleerd?"
              className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-yellow-500/50 resize-none"/>
          </div>
          <div className="flex gap-3">
            <button onClick={save} disabled={!form.title.trim()} className="bg-blue-700 hover:bg-blue-800 disabled:opacity-40 text-white font-bold px-6 py-2.5 rounded-xl text-sm">Opslaan</button>
            <button onClick={()=>{setEditing(false);setIsNew(false)}} className="text-gray-400 hover:text-white px-4 py-2.5 rounded-xl text-sm hover:bg-gray-800">Annuleren</button>

        </div>
      </div>:sel?<div className="max-w-2xl mx-auto p-8">
        <div className="flex items-start justify-between mb-6">
          <div>
            <p className="text-xs text-gray-500 uppercase tracking-wider mb-1">{fmtLong(sel.date)}</p>
            <h2 className="text-2xl font-bold text-white">{sel.title}</h2>
          </div>
          <span className="text-2xl">{MOODS.find(m=>m.v===sel.mood)?.e}</span>
        </div>
        <div className="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-4">
          <p className="text-gray-300 leading-relaxed text-sm whitespace-pre-wrap">{sel.content}</p>
        </div>
        {sel.learnings&&<div className="bg-yellow-500/10 border border-yellow-500/20 rounded-2xl p-5 mb-6">
          <p className="text-xs text-yellow-400 font-bold uppercase tracking-wider mb-2">💡 Leermoment</p>
          <p className="text-gray-300 text-sm leading-relaxed">{sel.learnings}</p>
        </div>}
        <div className="flex gap-3">
          <button onClick={()=>{setForm({...sel});setEditing(true);setIsNew(false)}} className="bg-blue-700 hover:bg-blue-800 text-white text-sm font-medium px-5 py-2.5 rounded-xl">Bewerken</button>
          <button onClick={()=>remove(sel)} className="flex items-center gap-2 text-red-400 hover:bg-red-400/10 border border-red-400/20 text-sm px-4 py-2.5 rounded-xl"><Icon name="trash" size={14}/> Verwijderen</button>
        </div>
      </div>:<div className="flex flex-col items-center justify-center h-full min-h-80 text-center p-8">
        <Icon name="book" size={48} className="text-gray-700 mb-4"/>
        <h3 className="text-xl font-bold text-white mb-2">Jouw journal</h3>
        <p className="text-gray-500 text-sm mb-6 max-w-xs">Schrijf dagelijks over je ervaringen en leermomenten.</p>
        <button onClick={startNew} className="bg-blue-700 hover:bg-blue-800 text-white font-bold px-6 py-3 rounded-xl text-sm">Eerste entry schrijven</button>
      </div>}
    </div>
  </div>
}

// ── Habits ────────────────────────────────────────────────────────────────────
const HC=['#ef4444','#1d4ed8','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899']
const emptyH = {name:'',phase:1,type:'build',color:'#3b82f6'}

function Habits() {
  const {getHabits,addHabit,deleteHabit,toggleHabit,isDone,habitComps,activeId,getHabitNote,saveHabitNote,currentUser} = useApp()

  const [show,setShow] = useState(false)

  const [mCompliment,setMCompliment] = useState(0)
  const td=todayStr(), days=getLast30()
  const f = (k,v) => setForm(p=>({...p,[k]:v}))
  const save = () => { if(!form.name.trim()) return; addHabit(form); setForm(emptyH); setShow(false) }
  const isCoach = currentUser?.role==='coach'

  const COMPLIMENTS = [
    {e:'🔥', t:'Op fire!', msg:'Elke dag dat je dit doet bouw je aan een beter leven. Zo doe je dat.'},
    {e:'💪', t:'Yesss!', msg:'Je streak gaat omhoog. Kleine acties, groot resultaat — blijf gaan!'},
    {e:'⚡', t:'Killing it!', msg:'Dit is precies hoe gewoontes worden gebouwd. Trots op je!'},
    {e:'🌟', t:'Nice werk!', msg:'Consistentie is het geheim. En jij hebt het vandaag laten zien.'},
    {e:'🏆', t:'Chapeau!', msg:'Nog een dag erbij. Dit wordt een levenslange gewoonte — geloof het.'},
  ]

  const openModal = h => { setModal(h); setMStep('choice'); setMNote(''); setMCompliment(Math.floor(Math.random()*5)) }
  const closeModal = () => setModal(null)

  const handleGelukt = () => {
    toggleHabit(modal.id, td)
    setMStep('celebrate')
    setTimeout(closeModal, 2800)
  }
  const handleNietGelukt = () => setMStep('reason')
  const submitReason = () => {
    const n = mNote.trim()
    if(n) saveHabitNote(modal.id, td, n)
    closeModal()
  }

  return <div className="p-6 space-y-6 max-w-4xl">
    <div className="flex items-center justify-between">
      <div>
        <h1 className="text-2xl font-bold text-white">Gewoontes</h1>
        <p className="text-gray-400 text-sm mt-1">{habits.filter(h=>isDone(h.id,td)).length}/{habits.length} voltooid vandaag</p>

      <button onClick={()=>setShow(p=>!p)} className="flex items-center gap-2 bg-blue-700 hover:bg-blue-800 text-white font-bold px-4 py-2.5 rounded-xl text-sm">
        <Icon name="plus" size={15}/> Toevoegen
      </button>

      <div className="grid grid-cols-2 gap-4 mb-4">
        <div className="col-span-2">
          <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Naam</label>
          <input type="text" value={form.name} onChange={e=>f('name',e.target.value)} placeholder="Bijv. 10 min meditatie"
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-700"/>
        </div>
        <div>
          <label className="block text-xs text-gray-400 uppercase tracking-wider mb-1.5 font-medium">Fase</label>
          <select value={form.phase} onChange={e=>f('phase',Number(e.target.value))}

                  <svg width="10" height="8" viewBox="0 0 10 8"><path d="M1 4L3.5 6.5L9 1" stroke="white" strokeWidth="1.8" strokeLinecap="round" fill="none"/></svg>

              <div className="flex gap-2">
                <span className="text-xs px-2 py-0.5 rounded-full font-medium" style={{backgroundColor:`${phaseColor(h.phase)}15`,color:phaseColor(h.phase)}}>{phaseName(h.phase)}</span>
                <span className="text-xs px-2 py-0.5 rounded-full font-medium" style={{backgroundColor:`${h.color}15`,color:h.color}}>{h.type==='eliminate'?'Elimineer':'Opbouwen'}</span>
              </div>
            </div>
            <div className="flex items-center gap-3 ml-3 flex-shrink-0">
              <div className="text-right">
                <div className="flex items-center gap-1 justify-end" style={{color:streak>0?h.color:'#4b5563'}}>
                  <Icon name="flame" size={13}/><span className="text-sm font-bold">{streak}</span>
                </div>
                <p className="text-xs text-gray-600">streak</p>
              </div>
              <div className="text-right"><span className="text-sm font-bold text-white">{total}</span><p className="text-xs text-gray-600">/ 30d</p></div>
              <button onClick={()=>deleteHabit(h.id)} className="p-1.5 text-gray-700 hover:text-red-400 rounded-lg"><Icon name="trash" size={14}/></button>
            </div>
          </div>

          {/* Afvinken-knop (alleen client, alleen vandaag) */}
          {!isCoach && !doneToday &&
            <button onClick={()=>openModal(h)}
              className="w-full py-2.5 rounded-xl text-sm font-bold mb-3 border-2 transition-all hover:scale-[1.01]"
              style={{borderColor:h.color,color:h.color,backgroundColor:`${h.color}08`}}>
              ✓ Afvinken voor vandaag
            </button>
          }
          {!isCoach && doneToday && (() => {
            const note = getHabitNote(h.id, td)
            return <div className="mb-3">
              <div className="py-2 px-3 rounded-xl text-xs font-medium text-center mb-1" style={{backgroundColor:`${h.color}15`,color:h.color}}>
                ✓ Voltooid vandaag
              </div>
              {note && <div className="flex items-start gap-2 bg-gray-800 rounded-xl px-3 py-2 mt-1.5">
                <span className="text-gray-500 mt-0.5 flex-shrink-0">💬</span>
                <p className="text-xs text-gray-400 leading-relaxed">{note.note}</p>
              </div>}
            </div>
          })()}

          {/* Coach: toon notitie van klant indien aanwezig */}
          {isCoach && (() => {
            const note = getHabitNote(h.id, td)
            if(!note) return null
            return <div className="mb-3 flex items-start gap-2 bg-gray-800/60 border border-gray-700 rounded-xl px-3 py-2">
              <span className="text-gray-500 mt-0.5 flex-shrink-0">💬</span>
              <div>
                <p className="text-xs text-gray-500 mb-0.5">Reden klant</p>
                <p className="text-xs text-gray-300 leading-relaxed">{note.note}</p>
              </div>
            </div>
          })()}

          <div className="flex gap-1 flex-wrap">
            {days.map((d,i)=><button key={d} onClick={()=>toggleHabit(h.id,d)} title={fmtShort(d)}
              className={`w-6 h-6 rounded-md transition-all hover:opacity-80 ${d===td?'ring-2 ring-white ring-offset-1 ring-offset-gray-900':''}`}
              style={{backgroundColor:c30[i]?h.color:'#1f2937'}}/>)}
          </div>
          <div className="flex justify-between mt-1">
            <span className="text-xs text-gray-700">30 dagen geleden</span>
            <span className="text-xs text-gray-700">Vandaag</span>
          </div>
        </div>
      })}</div>}

    {/* Modal */}
    {modal && <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4" style={{backgroundColor:'rgba(0,0,0,0.75)'}}>
      <div className="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
        {mStep==='choice' && <>
          <p className="text-xs text-gray-500 uppercase tracking-wider mb-1 font-medium">Gewoonte afvinken</p>
          <h3 className="text-lg font-bold text-white mb-5">{modal.name}</h3>
          <div className="space-y-3">
            <button onClick={handleGelukt}
              className="w-full py-3.5 rounded-xl font-bold text-white text-sm flex items-center justify-center gap-2 transition-all hover:scale-[1.02]"
              style={{backgroundColor:'#22c55e',boxShadow:'0 0 20px rgba(34,197,94,0.25)'}}>
              ✅ Ja, gelukt!
            </button>
            <button onClick={handleNietGelukt}
              className="w-full py-3.5 rounded-xl font-bold text-sm flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-gray-300 transition-all">
              ❌ Niet gelukt vandaag
            </button>
          </div>
          <button onClick={closeModal} className="w-full mt-3 text-gray-600 hover:text-gray-400 text-xs py-1">Annuleren</button>
        </>}

        {mStep==='celebrate' && <div className="text-center py-2">
          <div className="text-5xl mb-3">{COMPLIMENTS[mCompliment].e}</div>
          <h3 className="text-xl font-black text-white mb-2">{COMPLIMENTS[mCompliment].t}</h3>
          <p className="text-gray-400 text-sm leading-relaxed">{COMPLIMENTS[mCompliment].msg}</p>
          <div className="mt-4 h-1 rounded-full overflow-hidden bg-gray-800">
            <div className="h-full rounded-full animate-pulse" style={{width:'100%',backgroundColor:'#22c55e'}}/>
          </div>
        </div>}

        {mStep==='reason' && <>
          <p className="text-2xl mb-2">💙</p>
          <h3 className="text-lg font-bold text-white mb-1">Geen zorgen</h3>
          <p className="text-gray-400 text-sm mb-4">Waarom denk je dat het vandaag niet is gegaan?</p>
          <textarea
            autoFocus
            value={mNote}
            onChange={e=>setMNote(e.target.value)}
            placeholder="Bijv. drukke dag, vergeten, niet lekker..."
            rows={3}
            className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-600 text-sm focus:outline-none focus:border-blue-700 resize-none mb-4"/>
          <div className="flex gap-2">
            <button onClick={submitReason}
              className="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl text-sm">
              Opslaan
            </button>
            <button onClick={closeModal}
              className="px-4 py-2.5 text-gray-500 hover:text-white text-sm rounded-xl hover:bg-gray-800">
              Sla over
            </button>
          </div>
        </>}
      </div>
    </div>}
  </div>
}

// ── Training ──────────────────────────────────────────────────────────────────
const ET=[{v:1,e:'😴'},{v:2,e:'😕'},{v:3,e:'😐'},{v:4,e:'💪'},{v:5,e:'🔥'}]
const emptyEx = () => ({id:uid(),name:'',sets:3,reps:10,weight:0})
const emptyT = () => ({date:todayStr(),title:'',type:'krachttraining',duration:60,exercises:[emptyEx()],notes:'',energy:4})

const rpeColor = r => r<=4?'#22c55e':r<=6?'#eab308':r<=8?'#f97316':'#ef4444'
const rpeLabel = r => r<=4?'Licht':r<=6?'Matig':r<=8?'Zwaar':'Maximaal'

// ── SchemaView ──────────────────────────────────────────────────────────────

    <div className="px-5 py-4 border-b border-gray-800 flex items-center gap-3">
      <div className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'rgba(201,168,76,0.12)'}}>
        <Icon name="schema" size={16} style={{color:'#c9a84c'}}/>
      </div>
      <div className="flex-1">
        <p className="text-xs uppercase tracking-widest font-semibold mb-0.5" style={{color:'#c9a84c'}}>Jouw Schema</p>
        <h3 className="text-white font-bold text-base leading-tight">{schema.name}</h3>
        {schema.description&&<p className="text-gray-500 text-xs mt-0.5">{schema.description}</p>}
      </div>
      <span className="text-xs text-gray-600">{schema.days?.length||0} dag{(schema.days?.length||0)===1?'':'en'}</span>
    </div>
    <div className="divide-y divide-gray-800">
      {(schema.days||[]).map(day=>{
        const open=openDay===day.id
        return <div key={day.id}>

            onClick={()=>setOpenDay(open?null:day.id)}>
            <div className="w-7 h-7 rounded-lg bg-gray-800 flex items-center justify-center flex-shrink-0">
              <Icon name={open?'chevU':'chevD'} size={13} className="text-gray-400"/>
            </div>
            <span className="font-semibold text-white text-sm flex-1">{day.name}</span>
            <span className="text-xs text-gray-600">{day.exercises?.length||0} oef.</span>
          </button>
          {open&&<div className="px-5 pb-4">
            <table className="w-full text-sm">
              <thead><tr className="text-xs text-gray-600 uppercase tracking-wider border-b border-gray-800">
                <th className="text-left py-2 font-medium">Oefening</th>
                <th className="text-center py-2 font-medium">Sets</th>
                <th className="text-center py-2 font-medium">Reps</th>
                <th className="text-center py-2 font-medium">KG</th>
                <th className="text-center py-2 font-medium">RPE</th>
              </tr></thead>
              <tbody>{(day.exercises||[]).map((ex,i)=><tr key={i} className="border-b border-gray-800/60 last:border-0">
                <td className="py-2.5 text-white font-medium">
                  {ex.name}
                  {ex.note&&<span className="block text-xs text-gray-500 font-normal mt-0.5">{ex.note}</span>}
                </td>
                <td className="py-2.5 text-center text-gray-300">{ex.sets}</td>
                <td className="py-2.5 text-center text-gray-300">{ex.reps}</td>
                <td className="py-2.5 text-center text-gray-300">{ex.weight>0?`${ex.weight}kg`:'BW'}</td>
                <td className="py-2.5 text-center">
                  <span className="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold"
                    style={{background:`${rpeColor(ex.rpe)}20`,color:rpeColor(ex.rpe)}}>
                    {ex.rpe}
                  </span>
                </td>
              </tr>)}</tbody>
            </table>
          </div>}
        </div>
      })}
